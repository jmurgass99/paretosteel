[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paretosteel"
version = "1.1.0"
description = "Steel member selection and optimization over commercial section catalogues (AISC v16 database, EN IPE/HEA/HEB): catalogue enumeration with non-dominated sorting, genetic algorithm by member groups, NSGA-II with Numba kernels and SciPy differential evolution; simplified AISC 360 and EN 1993-1-1 checks (compact flexure, E3 compression, H1 interaction, lateral-torsional buckling, HSS torsion), AISC 341 brace capacity design, AISC 360 and EN 1994-1-1 composite floor beams, bill of quantities with cost and embodied carbon, price sensitivity, reuse matching and a REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["steel", "steel-design", "section-optimization", "pareto", "nsga-ii", "genetic-algorithm", "differential-evolution", "aisc-360", "aisc-341", "en-1993-1-1", "en-1994-1-1", "eurocode-3", "composite-beam", "bracing", "embodied-carbon", "bill-of-quantities", "structural-engineering", "loadpath"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "scipy>=1.10", "numba>=0.59", "pydantic>=2.0"]

[project.optional-dependencies]
perf = ["numba>=0.59"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
memos = ["handcalcs>=1.6"]
test = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-timeout>=2.2", "hypothesis>=6.0"]

[project.urls]
Homepage = "https://github.com/jmurgass99/paretosteel"
Repository = "https://github.com/jmurgass99/paretosteel"
Issues = "https://github.com/jmurgass99/paretosteel/issues"

[tool.setuptools.packages.find]
include = ["paretosteel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos (optimización completa)",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "experimental: funcionalidad declarada experimental",
    "property: property-based con hypothesis",
]
