[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paretosteel"
version = "1.0.0"
description = "Multi-objective steel structure optimization: NSGA-II and genetic algorithms over commercial catalogues (AISC, European), weight, cost by country and LCA objectives, beam and column selectors, bracing, castellated and composite beams, LTB audit (AISC 360-22, EN 1993-1-1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesús Murgas" }]
keywords = ["steel-optimization", "nsga-ii", "genetic-algorithm", "pareto", "aisc-360", "en-1993-1-1", "lca", "structural-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.23", "scipy>=1.10", "numba>=0.59", "pydantic>=2.0"]

[project.optional-dependencies]
perf = ["numba>=0.59"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
memos = ["handcalcs>=1.6"]
test = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-timeout>=2.2", "hypothesis>=6.0"]

[project.urls]
Homepage = "https://github.com/jmurgass99/paretosteel"
Repository = "https://github.com/jmurgass99/paretosteel"
Issues = "https://github.com/jmurgass99/paretosteel/issues"

[tool.setuptools.packages.find]
include = ["paretosteel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos (optimización completa)",
    "integration: integración entre módulos",
    "api: endpoints REST",
    "experimental: funcionalidad declarada experimental",
    "property: property-based con hypothesis",
]
